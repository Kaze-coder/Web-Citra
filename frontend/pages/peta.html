<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Lokasi - Citra NET Manager</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .content-area {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      padding: 15px;
    }

    .map-controls-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .map-controls-panel .btn {
      white-space: nowrap;
    }

    .geocode-status-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin-left: 10px;
    }

    /* Status Indicator */
    .gee-status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .gee-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #B4B2AC;
      flex-shrink: 0;
    }

    .gee-status-dot.gee-connected {
      background: var(--green-text);
      box-shadow: none;
    }

    .gee-status-dot.gee-loading {
      background: var(--yellow-text);
      animation: gee-pulse 1.2s ease-in-out infinite;
    }

    @keyframes gee-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Map container */
    .map-wrapper {
      flex: 1;
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: none;
      min-height: 400px;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Map Loading Overlay */
    .map-loading-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(251, 251, 250, 0.9);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: var(--radius);
    }

    .map-loading-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .map-loading-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .map-loading-subtext {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: -8px;
    }

    /* Leaflet popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .leaflet-popup-content {
      margin: 8px 12px;
      font-family: var(--font-sans);
    }

    .popup-content-customer { font-size: 13px; }
    .popup-content-customer b { font-size: 14px; color: var(--text-strong); display: block; margin-bottom: 8px; }
    .popup-content-customer hr { margin: 5px 0; border: none; border-top: 1px solid var(--border); }
    .popup-content-customer small { color: var(--text-secondary); line-height: 1.6; }
    .popup-info-item { margin: 3px 0; display: flex; align-items: flex-start; }
    .popup-info-item i { color: var(--blue-text); margin-right: 6px; font-size: 12px; margin-top: 2px; flex-shrink: 0; }

    .leaflet-marker-icon { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
    .leaflet-marker-icon:hover { filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }
  </style>

  <script>
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
      document.documentElement.classList.add('sidebar-collapsed');
    }
  </script>
</head>
<body>
  <div class="wrapper d-flex">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="../assets/logo.png" alt="Citra NET">
          <span class="logo-text">Citra NET Manager</span>
        </div>
      </div>

      <ul class="nav-menu">
        <li class="nav-item">
          <a href="../index.html" class="nav-link">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="pelanggan.html" class="nav-link">
            <i class="fas fa-users"></i>
            <span>Data Pelanggan</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="perangkat.html" class="nav-link">
            <i class="fas fa-server"></i>
            <span>Data Perangkat</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="tagihan.html" class="nav-link">
            <i class="fas fa-file-invoice"></i>
            <span>Data Tagihan</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="peta.html" class="nav-link active">
            <i class="fas fa-map-location-dot"></i>
            <span>Peta Lokasi</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="jadwal-pengiriman.html" class="nav-link">
            <i class="fas fa-calendar-check"></i>
            <span>Jadwal Pengiriman</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Topbar -->
      <nav class="topbar">
        <div class="topbar-left">
          <button class="btn-toggle-sidebar" id="toggleSidebar" title="Toggle Sidebar">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="page-title">Peta Lokasi Pelanggan</h1>
        </div>
      </nav>

      <!-- Content -->
      <div class="content-area">
        <div class="map-controls-panel">
          <button id="refreshMapBtn" class="btn btn-sm btn-primary" title="Refresh peta">
            <i class="fas fa-sync-alt"></i> Refresh Peta
          </button>
          <button id="geocodeBtn" class="btn btn-sm btn-info" title="Generate koordinat pelanggan">
            <i class="fas fa-location-crosshairs"></i> Generate Koordinat
          </button>
          <div id="geocodeStatus" class="geocode-status-text"></div>

          <!-- Status Indicator -->
          <div class="gee-status-bar">
            <div class="gee-status-dot gee-loading" id="geeStatusIndicator"></div>
            <span id="geeStatusText">Memuat peta satelit...</span>
          </div>
        </div>

        <div class="map-wrapper">
          <div id="map"></div>
          <!-- Loading Overlay -->
          <div class="map-loading-overlay" id="mapLoadingOverlay">
            <div class="map-loading-spinner"></div>
            <div class="map-loading-text">Memuat Peta Satelit</div>
            <div class="map-loading-subtext">ESRI World Imagery + OpenStreetMap</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/peta.js"></script>
</body>
</html>
