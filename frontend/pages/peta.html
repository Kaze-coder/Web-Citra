<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Lokasi - Citra NET Manager</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .content-area {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      padding: 15px;
    }

    .map-controls-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .map-controls-panel .btn {
      white-space: nowrap;
    }

    .geocode-status-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin-left: 10px;
    }

    /* Status Indicator */
    .gee-status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding: 5px 12px;
      border-radius: 9999px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 500;
      color: var(--mute);
    }

    .gee-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #A7B2BE;
      flex-shrink: 0;
    }

    .gee-status-dot.gee-connected {
      background: var(--signal);
      box-shadow: none;
    }

    .gee-status-dot.gee-loading {
      background: var(--warn-text);
      animation: gee-pulse 1.2s ease-in-out infinite;
    }

    @keyframes gee-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Map container */
    .map-wrapper {
      flex: 1;
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: none;
      min-height: 400px;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Map Loading Overlay */
    .map-loading-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(244, 246, 248, 0.9);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: var(--radius);
    }

    .map-loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--line);
      border-top: 3px solid var(--signal);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .map-loading-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .map-loading-subtext {
      font-size: 12px;
      color: var(--mute);
      margin-top: -6px;
    }

    /* Leaflet popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      border: 1px solid var(--line);
      box-shadow: 0 2px 10px rgba(15, 27, 45, 0.06);
    }

    .leaflet-popup-content {
      margin: 8px 12px;
      font-family: var(--font-body);
    }

    .popup-content-customer { font-size: 13px; }
    .popup-content-customer b { font-size: 14px; color: var(--ink); display: block; margin-bottom: 8px; }
    .popup-content-customer hr { margin: 5px 0; border: none; border-top: 1px solid var(--line); }
    .popup-content-customer small { color: var(--mute); line-height: 1.6; }
    .popup-info-item { margin: 3px 0; display: flex; align-items: flex-start; }
    .popup-info-item i { color: var(--signal); margin-right: 6px; font-size: 12px; margin-top: 2px; flex-shrink: 0; }

    .leaflet-marker-icon { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
    .leaflet-marker-icon:hover { filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }
  </style>

  <script>
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
      document.documentElement.classList.add('sidebar-collapsed');
    }
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke konten</a>
  <div class="wrapper d-flex">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="../assets/logo.png" alt="Citra NET">
          <span class="logo-text">Citra NET Manager</span>
        </div>
      </div>

      <ul class="nav-menu">
        <li class="nav-item">
          <a href="../index.html" class="nav-link">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="pelanggan.html" class="nav-link">
            <i class="fas fa-users"></i>
            <span>Data Pelanggan</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="perangkat.html" class="nav-link">
            <i class="fas fa-server"></i>
            <span>Data Perangkat</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="tagihan.html" class="nav-link">
            <i class="fas fa-file-invoice"></i>
            <span>Data Tagihan</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="peta.html" class="nav-link active">
            <i class="fas fa-map-location-dot"></i>
            <span>Peta Lokasi</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="jadwal-pengiriman.html" class="nav-link">
            <i class="fas fa-calendar-check"></i>
            <span>Jadwal Pengiriman</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
      <!-- Topbar -->
      <nav class="topbar">
        <div class="topbar-left">
          <button class="btn-toggle-sidebar" id="toggleSidebar" title="Toggle Sidebar" aria-label="Toggle sidebar">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="page-title">Peta Lokasi Pelanggan</h1>
        </div>
        <div class="signal-indicator">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect class="sig-bar sig-bar-1" x="1" y="8" width="2.5" height="5" rx="1" fill="currentColor"/>
            <rect class="sig-bar sig-bar-2" x="5.75" y="5" width="2.5" height="8" rx="1" fill="currentColor"/>
            <rect class="sig-bar sig-bar-3" x="10.5" y="2" width="2.5" height="11" rx="1" fill="currentColor"/>
          </svg>
          <span>Terhubung</span>
        </div>
      </nav>

      <!-- Content -->
      <div class="content-area">
        <div class="map-controls-panel">
          <button id="refreshMapBtn" class="btn btn-sm btn-primary" title="Refresh peta" aria-label="Refresh peta">
            <i class="fas fa-sync-alt"></i> Refresh Peta
          </button>
          <button id="geocodeBtn" class="btn btn-sm btn-info" title="Generate koordinat pelanggan" aria-label="Generate koordinat pelanggan">
            <i class="fas fa-location-crosshairs"></i> Generate Koordinat
          </button>
          <div id="geocodeStatus" class="geocode-status-text"></div>

          <!-- Status Indicator -->
          <div class="gee-status-bar">
            <div class="gee-status-dot gee-loading" id="geeStatusIndicator"></div>
            <span id="geeStatusText">Memuat peta satelit...</span>
          </div>
        </div>

        <div class="map-wrapper">
          <div id="map"></div>
          <!-- Loading Overlay -->
          <div class="map-loading-overlay" id="mapLoadingOverlay">
            <div class="map-loading-spinner"></div>
            <div class="map-loading-text">Memuat Peta Satelit</div>
            <div class="map-loading-subtext">ESRI World Imagery + OpenStreetMap</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/peta.js"></script>
</body>
</html>
