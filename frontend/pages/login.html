<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Citra NET Manager</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    /* ===== Halaman Login (standalone, di luar layout aplikasi) ===== */
    .login-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--paper);
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: none;
      overflow: hidden;
      animation: login-rise 300ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .login-card-body {
      padding: 40px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      margin-bottom: 14px;
    }

    .login-brand h1 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--ink);
      margin: 0;
    }

    .login-brand p {
      font-size: 13px;
      color: var(--mute);
      margin: 8px 0 0;
    }

    /* Indikator sinyal di atas form */
    .login-signal {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      color: var(--signal);
    }

    .login-signal span {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--mute);
    }

    /* Toggle lihat/sembunyikan password */
    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 44px;
    }

    .btn-toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--mute);
      cursor: pointer;
      transition: color 150ms ease, background-color 150ms ease;
    }

    .btn-toggle-password:hover {
      color: var(--ink);
      background: var(--surface-2);
    }

    .btn-toggle-password:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 2px;
    }

    .btn-login {
      margin-top: 8px;
      height: 38px;
      padding: 0 18px;
      font-size: 13px;
    }

    .login-footer {
      margin: 24px 0 0;
      text-align: center;
      font-size: 12px;
      color: var(--mute);
    }

    @keyframes login-rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-card {
        animation: none;
      }
    }

    @media (max-width: 480px) {
      .login-card-body {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke konten</a>
  <main class="login-wrapper" id="main-content">
    <div class="login-card">
      <div class="login-card-body">
        <div class="login-brand">
          <img src="../assets/logo.png" alt="Logo Citra NET">
          <h1>Citra NET Manager</h1>
          <p>Masuk ke akun admin Anda</p>
        </div>

        <div class="login-signal">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect class="sig-bar sig-bar-1" x="1" y="8" width="2.5" height="5" rx="1" fill="currentColor"/>
            <rect class="sig-bar sig-bar-2" x="5.75" y="5" width="2.5" height="8" rx="1" fill="currentColor"/>
            <rect class="sig-bar sig-bar-3" x="10.5" y="2" width="2.5" height="11" rx="1" fill="currentColor"/>
          </svg>
          <span>Jaringan Aktif</span>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username"
                   autocomplete="username" required autofocus>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Masukkan password"
                     autocomplete="current-password" required>
              <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Tampilkan password">
                <i class="fas fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-login" id="btnLogin">Masuk</button>
        </form>

        <p class="login-footer">&copy; Citra NET Manager</p>
      </div>
    </div>
  </main>

  <!-- Scripts: axios & notyf dulu, lalu main.js (konfigurasi axios + auth), terakhir login.js -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
