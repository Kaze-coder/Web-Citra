<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Citra NET Manager</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    /* ===== Halaman Login (standalone, di luar layout aplikasi) ===== */
    .login-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background:
        radial-gradient(ellipse 560px 380px at 12% 6%, rgba(37, 99, 235, 0.09), transparent 65%),
        radial-gradient(ellipse 520px 360px at 88% 94%, rgba(14, 165, 233, 0.09), transparent 65%),
        #f7f8ff;
    }

    /* Grid samar di latar belakang */
    .login-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(15, 23, 42, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 23, 42, 0.03) 1px, transparent 1px);
      background-size: 34px 34px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 42%, black, transparent 78%);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 42%, black, transparent 78%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: login-rise 0.55s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    /* Aksen garis gradasi di atas kartu */
    .login-card::before {
      content: '';
      display: block;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--info));
    }

    .login-card-body {
      padding: 36px 32px 30px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 14px;
    }

    .login-brand h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--dark);
      margin: 0;
    }

    .login-brand p {
      font-size: 13.5px;
      color: var(--secondary);
      margin: 6px 0 0;
    }

    /* Toggle lihat/sembunyikan password */
    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 46px;
    }

    .btn-toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 6px;
      color: var(--secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-toggle-password:hover {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .btn-toggle-password:focus-visible {
      outline: none;
      color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    .btn-login {
      margin-top: 8px;
      padding: 12px 22px;
      font-size: 15px;
    }

    .login-footer {
      margin: 22px 0 0;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    @keyframes login-rise {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-card {
        animation: none;
      }
    }

    @media (max-width: 480px) {
      .login-card-body {
        padding: 30px 22px 26px;
      }
    }
  </style>
</head>
<body>
  <main class="login-wrapper">
    <div class="login-card">
      <div class="login-card-body">
        <div class="login-brand">
          <img src="../assets/logo.png" alt="Logo Citra NET">
          <h1>Citra NET Manager</h1>
          <p>Masuk ke akun admin Anda</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username"
                   autocomplete="username" required autofocus>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Masukkan password"
                     autocomplete="current-password" required>
              <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Tampilkan password">
                <i class="fas fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-login" id="btnLogin">Masuk</button>
        </form>

        <p class="login-footer">&copy; Citra NET Manager</p>
      </div>
    </div>
  </main>

  <!-- Scripts: axios & notyf dulu, lalu main.js (konfigurasi axios + auth), terakhir login.js -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
