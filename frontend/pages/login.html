<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Citra NET Manager</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    /* ===== Halaman Login (standalone, di luar layout aplikasi) ===== */
    .login-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--bg);
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: none;
      overflow: hidden;
      animation: login-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .login-card-body {
      padding: 40px 36px 32px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-brand img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .login-brand h1 {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--text-strong);
      margin: 0;
    }

    .login-brand p {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin: 8px 0 0;
    }

    /* Toggle lihat/sembunyikan password */
    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 46px;
    }

    .btn-toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .btn-toggle-password:hover {
      color: var(--text-strong);
      background: var(--surface-hover);
    }

    .btn-toggle-password:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    .btn-login {
      margin-top: 8px;
      padding: 12px 22px;
      font-size: 14px;
    }

    .login-footer {
      margin: 24px 0 0;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    @keyframes login-rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-card {
        animation: none;
      }
    }

    @media (max-width: 480px) {
      .login-card-body {
        padding: 32px 24px 26px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke konten</a>
  <main class="login-wrapper" id="main-content">
    <div class="login-card">
      <div class="login-card-body">
        <div class="login-brand">
          <img src="../assets/logo.png" alt="Logo Citra NET">
          <h1>Citra NET Manager</h1>
          <p>Masuk ke akun admin Anda</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username"
                   autocomplete="username" required autofocus>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Masukkan password"
                     autocomplete="current-password" required>
              <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Tampilkan password">
                <i class="fas fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-login" id="btnLogin">Masuk</button>
        </form>

        <p class="login-footer">&copy; Citra NET Manager</p>
      </div>
    </div>
  </main>

  <!-- Scripts: axios & notyf dulu, lalu main.js (konfigurasi axios + auth), terakhir login.js -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
