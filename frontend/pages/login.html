<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Citra NET Manager</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css">
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    /* ===== Halaman Login (standalone, di luar layout aplikasi) ===== */
    .login-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--background);
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: none;
      border-radius: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      animation: login-rise 0.15s ease-out both;
    }

    .login-card-body {
      padding: 24px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .login-brand h1 {
      font-family: var(--font-sans);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--foreground);
      margin: 0;
    }

    .login-brand p {
      font-size: 12px;
      color: var(--muted-foreground);
      margin: 6px 0 0;
    }

    /* Toggle lihat/sembunyikan password */
    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 40px;
    }

    .btn-toggle-password {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 6px;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .btn-toggle-password:hover {
      color: var(--foreground);
      background: var(--muted);
    }

    .btn-toggle-password:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    .btn-login {
      margin-top: 8px;
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
    }

    .login-footer {
      margin: 20px 0 0;
      text-align: center;
      font-size: 11px;
      color: var(--muted-foreground);
    }

    @keyframes login-rise {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-card {
        animation: none;
      }
    }

    @media (max-width: 480px) {
      .login-card-body {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke konten</a>
  <main class="login-wrapper" id="main-content">
    <div class="login-card">
      <div class="login-card-body">
        <div class="login-brand">
          <img src="../assets/logo.png" alt="Logo Citra NET">
          <h1>Citra NET Manager</h1>
          <p>Masuk ke akun admin Anda</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username"
                   autocomplete="username" required autofocus>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Masukkan password"
                     autocomplete="current-password" required>
              <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Tampilkan password">
                <i class="fas fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-login" id="btnLogin">Masuk</button>
        </form>

        <p class="login-footer">&copy; Citra NET Manager</p>
      </div>
    </div>
  </main>

  <!-- Scripts: axios & notyf dulu, lalu main.js (konfigurasi axios + auth), terakhir login.js -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
